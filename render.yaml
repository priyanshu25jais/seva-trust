# Render blueprint: one web service serves the API and the built React app.
# Create a MongoDB Atlas free cluster first and paste its connection string as MONGODB_URI.
services:
  - type: web
    name: seva-trust
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: TRUST_NAME
        value: Seva Trust
      - key: TRUST_NAME_HI
        value: सेवा ट्रस्ट
      - key: TRUST_PAN
        value: AAAAA0000A
      - key: TRUST_80G_NUMBER
        value: PLACEHOLDER80G
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
